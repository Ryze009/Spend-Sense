kind = "web"
previewPath = "/"
title = "Purchase Tracker"
version = "1.0.0"
id = "artifacts/purchase-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20498

[services.development]
run = "pnpm --filter @workspace/purchase-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/purchase-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/purchase-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20498"
BASE_PATH = "/"
